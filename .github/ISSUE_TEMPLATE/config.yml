# Keeps the "blank issue" escape hatch open — a report that fits neither
# template is better filed loosely than not filed at all.
blank_issues_enabled: true
contact_links:
  - name: Security vulnerability
    url: https://github.com/triplegtech/flutter-web-scanner/security/advisories/new
    about: Report privately. Please do not open a public issue for a security problem.
  - name: Question or usage help
    url: https://github.com/triplegtech/flutter-web-scanner/discussions
    about: For "how do I…" — the issue tracker is for bugs and feature requests.
