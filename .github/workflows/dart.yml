name: Publish Flutter Package to pub.dev

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify the tag matches the published version
        # A tag that disagrees with pubspec.yaml publishes the wrong version
        # under the right name, and pub.dev releases cannot be retracted freely.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "tag=$tag pubspec=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $version"
            exit 1
          fi
          if ! grep -q "$version" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $version"
            exit 1
          fi

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        # The release gate: a tag must not be able to publish a red suite.
        run: flutter test

      - name: Decode pub credentials
        run: |
          mkdir -p $HOME/.config/dart # Standard directory for credentials
          echo "${{ secrets.PUB_CREDENTIAL_JSON}}" > $HOME/.config/dart/pub-credentials.json

      - name: Check publish warnings
        run: dart pub publish --dry-run

      - name: Publish package
        run: dart pub publish --force

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Release $GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](CHANGELOG.md) for details."
