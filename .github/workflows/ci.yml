name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A new push to a PR makes the previous run's answer irrelevant. A run on
  # main may be mid-release, so those queue instead of being cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default, so a fork's pull_request run cannot write anything.
# Only `release` needs more, and it asks for it itself.
permissions:
  contents: read

env:
  # Line coverage the package must not fall below.
  MIN_COVERAGE: 80

jobs:
  test:
    name: Format, analyze and test
    # Quality gates belong to the pull request: they run when it is opened and
    # on every push to it, so what gets merged is what was verified.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        # Advisory, not a gate. `dart format` output changes between Dart
        # releases, so this job (which tracks stable) disagrees with a developer
        # formatting on the SDK floor — through no fault of the code. Reported
        # as a warning so drift stays visible without blocking a merge.
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        # --fatal-infos so lint hints cannot accumulate silently between
        # releases; the package currently analyzes clean at this level.
        run: flutter analyze --fatal-infos

      - name: Run unit and widget tests
        run: flutter test --coverage

      - name: Enforce coverage threshold
        run: |
          covered=$(grep -c '^DA:[0-9]*,[1-9]' coverage/lcov.info)
          total=$(grep -c '^DA:' coverage/lcov.info)
          percent=$(awk "BEGIN { printf \"%.2f\", $covered * 100 / $total }")
          echo "Line coverage: $percent% ($covered/$total)"
          awk "BEGIN { exit ($percent < $MIN_COVERAGE) }" || {
            echo "::error::Coverage $percent% is below the ${MIN_COVERAGE}% minimum"
            exit 1
          }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: coverage/lcov.info
          if-no-files-found: warn

      - name: Validate package layout
        # The package is not published to pub.dev yet, but a dry run is still
        # the only check that the pubspec, the LICENSE and the file list would
        # be accepted — cheap to keep passing, expensive to fix all at once on
        # the day the first publish is attempted.
        run: dart pub publish --dry-run

  min-sdk:
    # The pubspec claims support down to Flutter 3.41.4 / Dart 3.11; nothing
    # else verifies that claim, since the `test` job tracks stable and would
    # keep passing as the floor drifts out from under it.
    name: Minimum supported SDK
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test

  web-build:
    # `flutter test` runs on the VM, where the conditional import resolves to
    # the unsupported stub — so the entire js_interop layer is unverified until
    # something compiles it for the browser. This is that something.
    name: Example web build
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze the example
        run: flutter analyze

      - name: Build for the web
        run: flutter build web --release

  release:
    # Releasing is a consequence of merging, not of tagging: one branch per
    # version lands on main, and the release for that version comes out of the
    # merge. The version branch is never touched here — nothing in this
    # workflow deletes a branch, so it stays in the repository as the record of
    # what that version changed.
    #
    # The trigger is "pubspec.yaml carries a version that has no tag yet", so a
    # merge that changes no version costs one short job and releases nothing,
    # and re-running the workflow on an already-released commit is a no-op
    # rather than a duplicate release.
    #
    # It deliberately does not `needs:` the jobs above — those are skipped on a
    # push, and a dependency on a skipped job would skip this one too. Their
    # guarantee comes from branch protection (the PR cannot merge red); the
    # analyze and test steps below are the second line of defence, so a direct
    # push to main still cannot release a broken version.
    name: Tag and release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Creating the tag and the GitHub release.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags decide whether this version was already released, and the
          # default shallow fetch brings none of them.
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decide whether this version needs releasing
        id: version
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "v$version is already tagged; nothing to release"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version has no tag yet; releasing"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract the release notes from the CHANGELOG
        # The CHANGELOG is the release notes. Failing here when the section is
        # missing is the point: a release whose body is a link to a file that
        # does not describe it is worse than a red build.
        if: steps.version.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="## $VERSION" '
            $0 == v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section with content"
            exit 1
          fi

          echo "Release notes for v$VERSION:"
          cat release-notes.md

      - name: Install dependencies
        if: steps.version.outputs.needed == 'true'
        run: flutter pub get

      - name: Analyze
        if: steps.version.outputs.needed == 'true'
        run: flutter analyze --fatal-infos

      - name: Run unit and widget tests
        # Re-run at the merge commit rather than trusting the PR's green tick:
        # another PR may have landed in between, and this is the exact tree the
        # tag will point at.
        if: steps.version.outputs.needed == 'true'
        run: flutter test

      - name: Tag the released commit
        # A tag pushed with GITHUB_TOKEN deliberately does not start another
        # workflow run, so this cannot trigger itself.
        if: steps.version.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      - name: Create the GitHub release
        if: steps.version.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A version carrying a pre-release suffix (3.0.0-beta.1) is marked as
          # such, so it never becomes the repository's "latest" release.
          case "$VERSION" in
            *-*) prerelease=--prerelease ;;
            *)   prerelease= ;;
          esac

          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            $prerelease
