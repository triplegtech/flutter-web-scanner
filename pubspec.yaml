name: omni_qrcode_barcode_web_reader
description: "Camera-based QR code and barcode scanning for Flutter Web, with capability-driven camera selection and check-digit validation."
version: 2.2.0
homepage: https://github.com/omnipharma/omni_qrcode_barcode_web_reader.git
repository: https://github.com/omnipharma/omni_qrcode_barcode_web_reader
issue_tracker: https://github.com/omnipharma/omni_qrcode_barcode_web_reader/issues

topics:
  - barcode
  - qrcode
  - scanner
  - camera
  - web

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.4"

dependencies:
  flutter:
    sdk: flutter
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.1

platforms:
  web:

flutter:
  assets:
    - assets/js/scanner.js
